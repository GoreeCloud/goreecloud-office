name: Validate Office Foundation

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: validate-office-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, lint, test, build, and validate schemas
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.1

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          rustc --version | grep -E '^rustc 1\.98\.1 '

      - name: Verify dependency lock
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          git diff --exit-code -- Cargo.lock

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Build
        run: cargo build --workspace

      - name: Validate JSON schemas
        shell: bash
        run: |
          set -euo pipefail
          for schema in schemas/office/v1/*.schema.json; do
            python3 -m json.tool "$schema" >/dev/null
          done
