[workspace]
members = [
  "crates/office-document",
  "crates/office-formats",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "AGPL-3.0-or-later"
repository = "https://github.com/GoreeCloud/goreecloud-office"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
uuid = "=1.26.1"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
